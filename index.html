<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahifalovchi</title>
    <meta name="theme-color" content="#059669">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { transition: background-color .2s, color .2s; }
        .page-count-input {
            background-color: transparent;
            appearance: textfield;
            transition: border-color .2s, box-shadow .2s;
        }
        .page-count-input::-webkit-inner-spin-button,
        .page-count-input::-webkit-outer-spin-button { appearance: none; margin: 0; }
        .page-count-input:focus {
            border-color: #059669;
            outline: none;
            box-shadow: none;
        }
        .page-count-controls {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            height: 100%;
            flex-direction: column;
            justify-content: center;
        }
        .page-count-control {
            display: grid;
            width: 2rem;
            flex: 1;
            place-items: center;
            color: #059669;
            background: transparent;
        }
        .page-count-control:hover { color: #047857; }
        .page-count-control:focus-visible { outline: 2px solid #6ee7b7; outline-offset: -2px; }
        body[data-theme="dark"] .page-count-control { color: #10b981; }
        body[data-theme="dark"] .page-count-control:hover { color: #34d399; }
        .calculate-button { transition: background-color .2s, box-shadow .2s, transform .2s; }
        .calculate-button:hover {
            background-color: #047857;
            box-shadow: 0 8px 18px rgba(5, 150, 105, .3);
        }
        .calculate-button:active { transform: translateY(0); }
        .calculate-button:focus-visible { outline: 3px solid #6ee7b7; outline-offset: 3px; }
        .calculate-dots { display: inline-flex; gap: .125rem; margin-left: .125rem; }
        .calculate-dots span { opacity: 0; }
        .calculating .calculate-dots span { animation: calculate-dot .9s ease-in-out forwards; }
        .calculating .calculate-dots span:nth-child(2) { animation-delay: .2s; }
        .calculating .calculate-dots span:nth-child(3) { animation-delay: .4s; }
        @keyframes calculate-dot {
            0%, 15%, 100% { opacity: 0; }
            35%, 65% { opacity: 1; }
        }
        @media (prefers-reduced-motion: reduce) {
            .calculating .calculate-dots span { animation: none; }
        }
        body[data-theme="light"] .save-button { background-color: #1e293b; }
        body[data-theme="light"] .calculate-button.save-button:hover {
            background-color: #0f172a;
            box-shadow: 0 8px 18px rgba(15, 23, 42, .3);
        }
        .custom-checkbox {
            position: relative;
            cursor: pointer;
        }
        .custom-checkbox-input {
            position: absolute;
            width: 1.125rem;
            height: 1.125rem;
            margin: 0;
            opacity: 0;
            cursor: pointer;
        }
        .custom-checkbox-mark {
            display: grid;
            width: 1.125rem;
            height: 1.125rem;
            flex: none;
            place-items: center;
            border: 1.5px solid #94a3b8;
            border-radius: .375rem;
            background: linear-gradient(145deg, #fff, #f1f5f9);
            transition: background-color .2s, border-color .2s, box-shadow .2s, transform .2s;
        }
        .custom-checkbox-mark svg { display: none; }
        .custom-checkbox-input:checked + .custom-checkbox-mark {
            border-color: #059669;
            background: linear-gradient(145deg, #10b981, #047857);
            box-shadow: 0 2px 6px rgba(5, 150, 105, .3);
        }
        .custom-checkbox-input:checked + .custom-checkbox-mark svg { display: block; }
        .custom-checkbox-input:focus-visible + .custom-checkbox-mark {
            outline: 3px solid #6ee7b7;
            outline-offset: 3px;
        }
        body[data-theme="dark"] .custom-checkbox-mark {
            border-color: #64748b;
            background: linear-gradient(145deg, #334155, #1e293b);
        }
        * {
            scrollbar-color: #059669 #e2e8f0;
            scrollbar-width: auto;
        }
        *::-webkit-scrollbar { width: 1rem; height: 1rem; }
        *::-webkit-scrollbar-track { background: #e2e8f0; }
        *::-webkit-scrollbar-thumb {
            border: 2px solid #e2e8f0;
            background: #059669;
        }
        *::-webkit-scrollbar-thumb:hover { background: #047857; }
        body[data-theme="dark"] * {
            scrollbar-color: #059669 #1e293b;
        }
        body[data-theme="dark"] *::-webkit-scrollbar-track { background: #1e293b; }
        body[data-theme="dark"] *::-webkit-scrollbar-thumb { border-color: #1e293b; }
        html[data-theme="dark"] { scrollbar-color: #059669 #0f172a; }
        html[data-theme="dark"]::-webkit-scrollbar-track { background: #0f172a; }
        html[data-theme="dark"]::-webkit-scrollbar-thumb { border-color: #0f172a; }
        #sheetPreview { max-height: 28rem; overflow: auto; }
        .sheet-card { min-width: 10rem; border: 1px solid #cbd5e1; border-radius: .75rem; background: white; padding: .75rem; }
        .sheet-side { display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; border: 1px solid #cbd5e1; border-radius: .4rem; }
        .sheet-page { padding: .65rem .25rem; text-align: center; font-weight: 700; }
        .sheet-page + .sheet-page { border-left: 1px dashed #94a3b8; }
        .help-dialog { width: min(42rem, calc(100% - 2rem)); max-height: 85vh; border: 0; padding: 0; }
        .help-dialog::backdrop { background: rgba(15, 23, 42, .65); backdrop-filter: blur(3px); }
        body[data-theme="dark"] { background-color: #0f172a !important; color: #e2e8f0; }
        body[data-theme="dark"] > .max-w-3xl { background-color: #1e293b !important; }
        body[data-theme="dark"] .help-dialog { background-color: #1e293b; color: #e2e8f0; }
        body[data-theme="dark"] .help-dialog .border-slate-200 { border-color: #475569; }
        body[data-theme="dark"] .bg-slate-100,
        body[data-theme="dark"] .bg-slate-50 { background-color: #273449 !important; }
        body[data-theme="dark"] .text-slate-800,
        body[data-theme="dark"] .text-slate-700,
        body[data-theme="dark"] .text-slate-600,
        body[data-theme="dark"] .text-slate-900,
        body[data-theme="dark"] .text-blue-900,
        body[data-theme="dark"] .text-slate-500 { color: #cbd5e1 !important; }
        body[data-theme="dark"] .border,
        body[data-theme="dark"] .border-b,
        body[data-theme="dark"] .border-t { border-color: #475569 !important; }
        body[data-theme="dark"] textarea,
        body[data-theme="dark"] input,
        body[data-theme="dark"] select { background-color: #0f172a; color: #e2e8f0; border-color: #475569; }
        body[data-theme="dark"] .page-count-input { background-color: transparent; }
        body[data-theme="dark"] .page-count-input:focus { border-color: #10b981 !important; }
        body[data-theme="dark"] .sheet-card { background: #273449; border-color: #475569; }
        body[data-theme="dark"] .sheet-side { border-color: #64748b; }
        body[data-theme="dark"] .sheet-page + .sheet-page { border-color: #64748b; }
        body[data-theme="dark"] .bg-amber-50 { background-color: #422006 !important; }
        body[data-theme="dark"] .text-amber-900 { color: #fde68a !important; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 sm:p-8">

    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-md p-6">
        <!-- Шапка и выбор языка -->
        <div class="flex flex-col sm:flex-row items-center justify-between border-b pb-4 mb-6 gap-4">
            <h1 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                <img src="./icon.svg" alt="" class="h-7 w-7 rounded">
                <span id="t-title">Sahifalovchi</span>
            </h1>
            
            <!-- Переключатель языка -->
            <div class="flex flex-wrap items-center justify-center gap-2">
                <select id="languageSelect" aria-label="Language" class="border rounded-lg px-2 py-2 text-xs">
                    <option value="uz">O'Z</option>
                    <option value="ru">RU</option>
                    <option value="en">EN</option>
                </select>
                <select id="themeSelect" aria-label="Theme" class="border rounded-lg px-2 py-2 text-xs">
                    <option value="system" id="t-theme-system">System</option>
                    <option value="light" id="t-theme-light">Light</option>
                    <option value="dark" id="t-theme-dark">Dark</option>
                </select>
            </div>
        </div>

        <!-- Управление -->
        <form novalidate onsubmit="calculateBooklet(); return false;" class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
            <div>
                <label id="t-label-pages" class="block text-sm font-bold text-blue-900 mb-1">Barcha sahifalar soni:</label>
                <div class="relative">
                    <input type="number" id="pageCount" placeholder="Sahifalar sonini kiriting"
                        class="page-count-input w-full border rounded-lg px-3 py-2 pr-10 text-sm">
                    <div class="page-count-controls" aria-label="Page count controls">
                        <button type="button" id="increasePageCount" class="page-count-control" aria-label="Sahifalar sonini oshirish">
                            <svg viewBox="0 0 16 16" class="h-3 w-3" aria-hidden="true"><path d="m3 10 5-5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </button>
                        <button type="button" id="decreasePageCount" class="page-count-control" aria-label="Sahifalar sonini kamaytirish">
                            <svg viewBox="0 0 16 16" class="h-3 w-3" aria-hidden="true"><path d="m3 6 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </button>
                    </div>
                </div>
            </div>
            <div class="flex items-end">
                <button type="submit" id="t-btn-calc"
                    class="calculate-button w-full bg-emerald-600 text-white font-medium py-2 px-4 rounded-lg text-sm">
                    <span id="t-btn-calc-label">Hisoblash</span>
                    <span class="calculate-dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span>
                </button>
            </div>
        </form>

        <!-- Инфо о листах -->
        <div class="bg-slate-50 p-4 rounded-lg mb-6 text-xs text-slate-600 space-y-1 border">
            <div><span id="t-info-sheets">Kerak boʻladigan A4 varaqlar soni:</span> <strong id="totalSheets" class="text-slate-900">0</strong></div>
            <div><span id="t-info-pages">Betlar soni:</span> <strong id="pagesResult" class="text-slate-900">0</strong></div>
        </div>

        <!-- 1-сторона -->
        <div class="mb-4">
            <div class="mb-1 flex flex-wrap items-center justify-between gap-2">
                <label id="t-label-side1" for="side1" class="block text-sm font-bold text-blue-900">1-taraf (Oldingi tomoni):</label>
                <div class="flex items-center gap-2">
                    <button type="button" onclick="copyPages('side1')" id="t-copy-side1" class="calculate-button rounded-lg bg-emerald-600 px-3 py-1 text-xs font-medium text-white">Nusxalash</button>
                    <label class="custom-checkbox flex items-center gap-2 text-xs font-bold text-blue-900">
                        <input type="checkbox" id="inline-side1" class="custom-checkbox-input" checked>
                        <span class="custom-checkbox-mark" aria-hidden="true">
                            <svg viewBox="0 0 16 16" class="h-3 w-3" fill="none">
                                <path d="m3.5 8.2 2.8 2.8 6.2-6.2" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </span>
                        <span id="t-layout-side1">Betlarni bir qatorda ko‘rsatish</span>
                    </label>
                </div>
            </div>
            <textarea id="side1" rows="5" readonly 
                placeholder="Hisoblash tugmasini bosing — sahifalar roʻyxati shu yerda koʻrinadi."
                wrap="soft" class="w-full border rounded-lg p-3 bg-slate-50 text-xs font-mono whitespace-pre-wrap break-words"></textarea>
        </div>

        <!-- 2-сторона -->
        <div class="mb-6">
            <div class="mb-1 flex flex-wrap items-center justify-between gap-2">
                <label id="t-label-side2" for="side2" class="block text-sm font-bold text-blue-900">2-taraf (Orqa tomoni):</label>
                <div class="flex items-center gap-2">
                    <button type="button" onclick="copyPages('side2')" id="t-copy-side2" class="calculate-button rounded-lg bg-emerald-600 px-3 py-1 text-xs font-medium text-white">Nusxalash</button>
                    <label class="custom-checkbox flex items-center gap-2 text-xs font-bold text-blue-900">
                        <input type="checkbox" id="inline-side2" class="custom-checkbox-input" checked>
                        <span class="custom-checkbox-mark" aria-hidden="true">
                            <svg viewBox="0 0 16 16" class="h-3 w-3" fill="none">
                                <path d="m3.5 8.2 2.8 2.8 6.2-6.2" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </span>
                        <span id="t-layout-side2">Betlarni bir qatorda ko‘rsatish</span>
                    </label>
                </div>
            </div>
            <textarea id="side2" rows="5" readonly 
                placeholder="Hisoblash tugmasini bosing — sahifalar roʻyxati shu yerda koʻrinadi."
                wrap="soft" class="w-full border rounded-lg p-3 bg-slate-50 text-xs font-mono whitespace-pre-wrap break-words"></textarea>
        </div>

        <section class="mb-6 rounded-lg border p-4">
            <div class="mb-3 flex flex-wrap items-center justify-between gap-3">
                <h2 id="t-preview-title" class="text-sm font-bold text-slate-800">Предпросмотр порядка листов</h2>
                <label class="custom-checkbox flex items-center gap-2 text-sm font-bold text-blue-900">
                    <input type="checkbox" id="invertFeed" class="custom-checkbox-input">
                    <span class="custom-checkbox-mark" aria-hidden="true">
                        <svg viewBox="0 0 16 16" class="h-3 w-3" fill="none">
                            <path d="m3.5 8.2 2.8 2.8 6.2-6.2" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    <span id="t-invert-label">Varaqlar tartibini teskari o‘zgartirish</span>
                </label>
            </div>
            <p id="t-feed-description" class="mb-3 text-xs text-slate-600"></p>
            <div id="sheetPreview" class="flex flex-wrap gap-3" aria-live="polite"></div>
            <p id="t-preview-empty" class="text-xs text-slate-500">Введите число страниц и нажмите «Рассчитать», чтобы увидеть листы.</p>
            <p id="t-preview-limit" class="mt-2 hidden text-xs text-slate-500"></p>
        </section>

        <!-- Кнопки сохранения -->
        <div class="flex justify-end gap-3">
            <button onclick="saveResult()" id="t-btn-save"
                class="calculate-button save-button bg-emerald-600 text-white font-medium py-2 px-5 rounded-lg text-sm">
                TXT formatida saqlash
            </button>
        </div>

        <section class="mt-8 border-t pt-6 text-sm text-slate-700">
            <h2 id="t-instructions-title" class="mb-3 text-lg font-bold text-slate-800">Varaqlarni toʻgʻri joylashtirish</h2>
            <ol id="t-instructions" class="list-decimal space-y-2 pl-5"></ol>
            <p id="t-instructions-note" class="mt-4 rounded-lg bg-amber-50 p-3 text-xs text-amber-900"></p>
        </section>

        <footer class="mt-8 border-t pt-5">
            <div class="flex flex-col items-center justify-between gap-3 text-center sm:flex-row sm:text-left">
                <div class="flex items-center gap-3">
                    <img src="./developer-photo.png" alt="Developer" class="h-12 w-12 rounded-full border-2 border-emerald-600 object-cover">
                    <div>
                        <p id="t-footer-title" class="text-xs font-semibold uppercase tracking-wide text-slate-500">Developer</p>
                        <a id="t-footer-name" href="https://github.com/zaynabiginov/Sahifachi" target="_blank" rel="noopener noreferrer" class="text-sm font-semibold text-emerald-700 hover:text-emerald-800 hover:underline">GitHub · zaynabiginov/Sahifachi</a>
                    </div>
                </div>
                <p id="t-footer-caption" class="text-xs text-slate-500">Sahifalovchi · Booklet maker</p>
            </div>
        </footer>

        <div class="mt-5 flex justify-center">
            <button type="button" id="t-help-open" aria-haspopup="dialog" aria-controls="helpDialog"
                class="calculate-button inline-flex items-center gap-2 rounded-lg bg-emerald-600 px-5 py-2 text-sm font-semibold text-white">
                <svg viewBox="0 0 20 20" class="h-4 w-4" fill="none" aria-hidden="true">
                    <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M7.8 7.5a2.25 2.25 0 1 1 3.8 1.63c-.95.9-1.6 1.2-1.6 2.37M10 14.5h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                <span id="t-help-button">Yordam</span>
            </button>
        </div>
    </div>

    <dialog id="helpDialog" class="help-dialog rounded-2xl bg-white text-slate-700 shadow-2xl">
        <div class="flex max-h-[85vh] flex-col">
            <div class="flex items-start justify-between gap-4 border-b p-5 sm:p-6">
                <div>
                    <h2 id="t-help-title" class="text-xl font-bold text-slate-800"></h2>
                    <p id="t-help-intro" class="mt-2 text-sm leading-6 text-slate-600"></p>
                </div>
                <button type="button" id="t-help-close" aria-label="Close help"
                    class="rounded-lg p-2 text-slate-500 hover:bg-slate-100 hover:text-slate-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-emerald-600">
                    <svg viewBox="0 0 20 20" class="h-5 w-5" fill="none" aria-hidden="true">
                        <path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
            <div id="t-help-sections" class="space-y-5 overflow-y-auto p-5 sm:p-6"></div>
            <div class="border-t p-4 text-right">
                <button type="button" id="t-help-done"
                    class="calculate-button rounded-lg bg-emerald-600 px-5 py-2 text-sm font-semibold text-white"></button>
            </div>
        </div>
    </dialog>

        let currentLang = 'uz';

        let isCalculating = false;

        function getSavedPreference(key, validValues, fallback) {
            try {
                const savedValue = localStorage.getItem(key);
                return validValues.includes(savedValue) ? savedValue : fallback;
            } catch (error) {
                console.error(`Failed to load preference "${key}":`, error);
                return fallback;
            }
        }

        function savePreference(key, value) {
            try {
                localStorage.setItem(key, value);
            } catch (error) {
                console.error(`Failed to save preference "${key}":`, error);
            }
        }

        function setLanguage(lang) {
            currentLang = lang;
            savePreference('sahifalovchi-language', lang);
            const t = langData[lang];
            document.documentElement.lang = lang;
            document.getElementById('languageSelect').value = lang;

            document.getElementById('t-title').textContent = t.title;
            document.getElementById('t-footer-title').textContent = t.footerTitle;
            document.getElementById('t-footer-name').textContent = t.footerName;
            document.getElementById('t-footer-caption').textContent = t.footerCaption;
            document.getElementById('t-label-pages').textContent = t.labelPages;
            document.getElementById('increasePageCount').setAttribute('aria-label', t.increasePageCount);
            document.getElementById('decreasePageCount').setAttribute('aria-label', t.decreasePageCount);
            document.getElementById('pageCount').placeholder = t.pageCountPlaceholder;
            document.getElementById('t-btn-calc-label').textContent = t.btnCalc;
            document.getElementById('t-info-sheets').textContent = t.infoSheets;
            document.getElementById('t-info-pages').textContent = t.infoPages;
            document.getElementById('t-label-side1').textContent = t.labelSide1;
            document.getElementById('t-label-side2').textContent = t.labelSide2;
            document.getElementById('t-layout-side1').textContent = t.layoutToggle;
            document.getElementById('t-layout-side2').textContent = t.layoutToggle;
            document.getElementById('side1').placeholder = t.resultPlaceholder;
            document.getElementById('side2').placeholder = t.resultPlaceholder;
            document.getElementById('t-copy-side1').textContent = t.copyButton;
            document.getElementById('t-copy-side2').textContent = t.copyButton;
            document.getElementById('t-btn-save').textContent = t.btnSave;
            document.getElementById('t-preview-title').textContent = t.previewTitle;
            document.getElementById('t-invert-label').textContent = t.invertLabel;
            document.getElementById('t-preview-empty').textContent = t.previewEmpty;
            document.getElementById('t-theme-system').textContent = t.themeSystem;
            document.getElementById('t-theme-light').textContent = t.themeLight;
            document.getElementById('t-theme-dark').textContent = t.themeDark;
            document.getElementById('languageSelect').setAttribute('aria-label', t.languageLabel);
            document.getElementById('themeSelect').setAttribute('aria-label', t.themeLabel);
            document.getElementById('t-instructions-title').textContent = t.instructionsTitle;
            const instructions = document.getElementById('t-instructions');
            instructions.replaceChildren(...t.instructions.map(step => {
                const item = document.createElement('li');
                item.textContent = step;
                return item;
            }));
            document.getElementById('t-instructions-note').textContent = t.instructionsNote;
            document.getElementById('t-help-button').textContent = t.helpButton;
            document.getElementById('t-help-title').textContent = t.helpTitle;
            document.getElementById('t-help-intro').textContent = t.helpIntro;
            document.getElementById('t-help-close').setAttribute('aria-label', t.helpClose);
            document.getElementById('t-help-done').textContent = t.helpClose;
            renderHelpSections(t.helpSections);
            renderSheetPreview();
        }

        function renderHelpSections(sections) {
            const container = document.getElementById('t-help-sections');
            container.replaceChildren(...sections.map(section => {
                const article = document.createElement('section');
                article.className = 'rounded-xl border border-slate-200 bg-slate-50 p-4';

                const heading = document.createElement('h3');
                heading.className = 'mb-2 font-bold text-slate-800';
                heading.textContent = section.title;

                const list = document.createElement('ul');
                list.className = 'list-disc space-y-2 pl-5 text-sm leading-6 text-slate-600';
                list.replaceChildren(...section.items.map(text => {
                    const item = document.createElement('li');
                    item.textContent = text;
                    return item;
                }));

                article.append(heading, list);
                return article;
            }));
        }

        function applyTheme() {
            const theme = document.getElementById('themeSelect').value;
            savePreference('sahifalovchi-theme', theme);
            const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.body.dataset.theme = isDark ? 'dark' : 'light';
            document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
        }

        function adjustPageCount(step) {
            const pageCount = document.getElementById('pageCount');
            if (step > 0) pageCount.stepUp();
            else pageCount.stepDown();
            pageCount.dispatchEvent(new Event('input', { bubbles: true }));
            pageCount.dispatchEvent(new Event('change', { bubbles: true }));
        }

        function renderSheetPreview() {
            const t = langData[currentLang];
            const isInverted = document.getElementById('invertFeed').checked;
            const orderedPairs = isInverted ? [...sheetPairs].reverse() : sheetPairs;
            const preview = document.getElementById('sheetPreview');
            const emptyMessage = document.getElementById('t-preview-empty');
            const limitMessage = document.getElementById('t-preview-limit');
            const description = document.getElementById('t-feed-description');
            const displayLimit = 200;

            description.textContent = isInverted ? t.feedInverted : t.feedNormal;
            preview.replaceChildren();
            emptyMessage.classList.toggle('hidden', orderedPairs.length > 0);

            orderedPairs.slice(0, displayLimit).forEach((sheet, index) => {
                const card = document.createElement('article');
                card.className = 'sheet-card text-xs text-slate-700';

                const heading = document.createElement('h3');
                heading.className = 'mb-2 font-semibold';
                const physicalSheet = isInverted ? sheetPairs.length - index : index + 1;
                heading.textContent = `${t.previewFeed} ${index + 1} · ${t.previewSheet} ${physicalSheet}`;

                const frontLabel = document.createElement('p');
                frontLabel.className = 'mb-1 text-slate-500';
                frontLabel.textContent = t.previewFront;
                const front = document.createElement('div');
                front.className = 'sheet-side mb-2';
                sheet.front.forEach(page => {
                    const pageCell = document.createElement('span');
                    pageCell.className = 'sheet-page';
                    pageCell.textContent = page;
                    front.append(pageCell);
                });

                const backLabel = document.createElement('p');
                backLabel.className = 'mb-1 text-slate-500';
                backLabel.textContent = t.previewBack;
                const back = document.createElement('div');
                back.className = 'sheet-side';
                sheet.back.forEach(page => {
                    const pageCell = document.createElement('span');
                    pageCell.className = 'sheet-page';
                    pageCell.textContent = page;
                    back.append(pageCell);
                });

                card.append(heading, frontLabel, front, backLabel, back);
                preview.append(card);
            });

            const omitted = orderedPairs.length - displayLimit;
            limitMessage.classList.toggle('hidden', omitted <= 0);
            if (omitted > 0) {
                limitMessage.textContent = t.previewLimit
                    .replace('{shown}', displayLimit)
                    .replace('{total}', orderedPairs.length);
            } else {
                limitMessage.textContent = '';
            }
        }

        function updateFeedOrder() {
            const isInverted = document.getElementById('invertFeed').checked;
            const orderedPairs = isInverted
                ? [...sheetPairs].reverse()
                : sheetPairs;
            document.getElementById('side1').value = formatPageList(orderedPairs, 'front', 'side1');
            document.getElementById('side2').value = formatPageList(orderedPairs, 'back', 'side2');
            renderSheetPreview();
        }

        function formatPageList(sheets, side, fieldId) {
            const separator = document.getElementById(`inline-${fieldId}`).checked ? ', ' : ',\n';
            return sheets.map(sheet => sheet[side].join(', ')).join(separator);
        }

        function updatePageListLayout(fieldId) {
            const orderedPairs = document.getElementById('invertFeed').checked
                ? [...sheetPairs].reverse()
                : sheetPairs;
            const side = fieldId === 'side1' ? 'front' : 'back';
            document.getElementById(fieldId).value = formatPageList(orderedPairs, side, fieldId);
        }

        async function copyPages(fieldId) {
            const t = langData[currentLang];
            const field = document.getElementById(fieldId);
            const selectionStart = field.selectionStart;
            const selectionEnd = field.selectionEnd;
            const text = selectionStart !== selectionEnd
                ? field.value.slice(selectionStart, selectionEnd)
                : field.value;
            const button = document.getElementById(`t-copy-${fieldId}`);

            if (!text) {
                alert(t.copyEmpty);
                return;
            }

            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                } else {
                    throw new Error('Clipboard API is unavailable in this context.');
                }
            } catch {
                const temporaryField = document.createElement('textarea');
                let copied = false;
                try {
                    temporaryField.value = text;
                    temporaryField.setAttribute('readonly', '');
                    temporaryField.style.position = 'fixed';
                    temporaryField.style.opacity = '0';
                    document.body.appendChild(temporaryField);
                    temporaryField.select();
                    copied = document.execCommand('copy');
                } catch {
                    copied = false;
                } finally {
                    temporaryField.remove();
                }

                if (!copied) {
                    alert(t.copyError);
                    return;
                }
            }

            button.textContent = t.copyDone;
            window.clearTimeout(copyResetTimers[fieldId]);
            copyResetTimers[fieldId] = window.setTimeout(() => {
                button.textContent = langData[currentLang].copyButton;
                delete copyResetTimers[fieldId];
            }, 2000);
        }

        function calculateBooklet() {
            if (isCalculating) return;

            let totalPages = parseInt(document.getElementById('pageCount').value) || 0;
            const t = langData[currentLang];

            if (totalPages < 4) {
                alert(t.alertMin);
                return;
            }

            if (totalPages % 4 !== 0) {
                totalPages = Math.ceil(totalPages / 4) * 4;
                alert(t.alertPageMultiple.replace("{pages}", totalPages));
                document.getElementById('pageCount').value = totalPages;
            }

            const calculateButton = document.getElementById('t-btn-calc');
            isCalculating = true;
            calculateButton.disabled = true;
            calculateButton.setAttribute('aria-busy', 'true');
            calculateButton.classList.add('calculating');

            try {
                let totalSheets = totalPages / 4;
                document.getElementById('totalSheets').textContent = totalSheets;
                document.getElementById('pagesResult').textContent = totalPages;

                sheetPairs = [];

                const endPage = totalPages;
                const sheetsInBook = totalPages / 4;

                for (let i = 0; i < sheetsInBook; i++) {
                    let p1 = endPage - (2 * i);
                    let p2 = 1 + (2 * i);
                    let p3 = 1 + (2 * i) + 1;
                    let p4 = endPage - (2 * i) - 1;

                    sheetPairs.push({ front: [p1, p2], back: [p3, p4] });
                }

                updateFeedOrder();
            } finally {
                window.setTimeout(() => {
                    calculateButton.classList.remove('calculating');
                    calculateButton.removeAttribute('aria-busy');
                    calculateButton.disabled = false;
                    isCalculating = false;
                }, 1400);
            }
        }

        function saveResult() {
            const t = langData[currentLang];
            let text = `${t.fileHeader1}\n` + document.getElementById('side1').value + "\n\n" +
                       `${t.fileHeader2}\n` + document.getElementById('side2').value;
            let blob = new Blob([text], { type: "text/plain;charset=utf-8" });
            let link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = currentLang === 'ru' ? "broshurator_result.txt" : currentLang === 'en' ? "booklet_result.txt" : "sahifalovchi_result.txt";
            link.click();
        }

        const systemThemePreference = window.matchMedia('(prefers-color-scheme: dark)');
        document.getElementById('languageSelect').addEventListener('change', event => setLanguage(event.target.value));
        document.getElementById('themeSelect').addEventListener('change', applyTheme);
        document.getElementById('invertFeed').addEventListener('change', updateFeedOrder);
        document.getElementById('inline-side1').addEventListener('change', () => updatePageListLayout('side1'));
        document.getElementById('inline-side2').addEventListener('change', () => updatePageListLayout('side2'));
        const helpDialog = document.getElementById('helpDialog');
        document.getElementById('t-help-open').addEventListener('click', () => helpDialog.showModal());
        document.getElementById('t-help-close').addEventListener('click', () => helpDialog.close());
        document.getElementById('t-help-done').addEventListener('click', () => helpDialog.close());
        helpDialog.addEventListener('cancel', event => {
            event.preventDefault();
            helpDialog.close();
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && helpDialog.open) {
                helpDialog.close();
            }
        });
        helpDialog.addEventListener('click', event => {
            if (event.target === helpDialog) helpDialog.close();
        });
        document.getElementById('increasePageCount').addEventListener('click', () => adjustPageCount(1));
        document.getElementById('decreasePageCount').addEventListener('click', () => adjustPageCount(-1));
        document.getElementById('side1').addEventListener('click', () => copyPages('side1'));
        document.getElementById('side2').addEventListener('click', () => copyPages('side2'));
        if (systemThemePreference.addEventListener) {
            systemThemePreference.addEventListener('change', () => {
                if (document.getElementById('themeSelect').value === 'system') applyTheme();
            });
        } else {
            systemThemePreference.addListener(() => {
                if (document.getElementById('themeSelect').value === 'system') applyTheme();
            });
        }
        window.onload = () => {
            const savedLanguage = getSavedPreference('sahifalovchi-language', Object.keys(langData), 'uz');
            const savedTheme = getSavedPreference('sahifalovchi-theme', ['system', 'light', 'dark'], 'system');
            document.getElementById('themeSelect').value = savedTheme;
            setLanguage(savedLanguage);
            applyTheme();
        };
        if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
            navigator.serviceWorker.register('./sw.js').catch(error => {
                console.error('Service worker registration failed:', error);
            });
        }
    </script>
</body>
